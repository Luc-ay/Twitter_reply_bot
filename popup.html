<!DOCTYPE html>
<html>
<head>
  <title>X Reply Gen</title>
  <style>
    body {
      width: 250px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    input {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #1DA1F2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: green;
    }
  </style>
</head>
<body>
  <h3>Settings</h3>
  <label for="apiKey">Gemini API Key:</label>
  <input type="password" id="apiKey" placeholder="Enter API Key">
  <button id="saveBtn">Save</button>
  <div id="status"></div>
  
  <div style="margin-top: 15px; font-size: 14px; display: flex; align-items: center; justify-content: space-between;">
    <label for="botLimit">Auto Bot Limit:</label>
    <input type="number" id="botLimit" value="10" min="1" max="100" style="width: 60px; padding: 4px; margin-bottom: 0;">
  </div>
  
  <button id="toggleBotBtn" style="background-color: #1DA1F2; margin-top: 10px;">Start Auto Bot</button>
  <div id="botStatus" style="font-size: 12px; margin-top: 5px; text-align: center; color: #555;">Bot is currently stopped.</div>

  <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #ddd; font-size: 14px; text-align: center;">
    Replies generated today: <strong id="replyCount" style="color: #1DA1F2;">0</strong>
  </div>

  <script src="popup.js"></script>
</body>
</html>
